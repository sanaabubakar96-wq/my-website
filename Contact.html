<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
    /*Basic Reset */
    .jumptron{
        text-align: center;
        padding: 20px;
        background: #fff;
    }
    .slider{
        width: 100px;
        height: 450px;
        object-fit: cover;
    }
    .slider img {
        width: 10px;
        height: 20px;
        animation: slide 9s infinite;
     }
     body{
        background-color: skyblue;
     }
    * {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Arial', sans-serif;
    }
    /*Header*/
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 50px;
        background-color: #333;
        color: skyblue;
    }
    header .logo {
        font-size: 24px;
        font-weight: bold;
    }
    header nav ul {
        list-style: none;
        display: flex;
        gap: 20px;
    }
    header nav ul li a {
        color: skyblue;
        text-decoration:none;
        font-weight: bold;
    }
    header nav ul li a:hovar {
        text-decoration: underline;
    }
    /* Hero Section */
    .hero {
        text-align: center;
        padding: 100px 20px;
        background: url();
        color: darkred;
    }
    .hero h1 {
        font-size: 48px;
        margin-bottom:20px ;
    }
    .hero p {
        font-size: 20px;
        margin-bottom: 30px;
    }
    .hero .btn {
        background-color: #ff6f61;
        padding: 15px 30px;
        color: skyblue;
        text-decoration: none;
        font-weight: bold;
        border: 5px;
    }
    .hero.btn:hover {
        background-color: #d63d2f;
    }
    /* products Section */
    .products {
        padding: 50px 20px;
        text-align: center;
    }
    .products h2 {
        font-size: 36px;
        margin-bottom: 40px;
    }
    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 30px;
    }
    .product-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
    }
    .product-card img {
        width: 100%;
        border-radius:5px;
        margin-bottom: 15px;
    }
    .product-card h3 {
        font-size: 20px;
        margin-bottom: 10px;
    }
    .product-card p {
        font-size: 18px;
        margin-bottom: 15PX;
        color: #FF6F61;
    }
    .product-card button {
        padding: 10PX 20PX;
        background-color: #333;
        color: skyblue;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }
    .product-card button:hover {
        background-color: #555;
    }
    /* FOOTER */
    footer {
        background-color: #333;
        color: skyblue;
        text-align: center;
        padding: 2OPX 0;
    }
    </style>
</head>
<body>
    <!--Header-->
    <header>
        <div class="logo">Contact </div>
        <nav>
            <ul>
                <li><a href="Home.html">Home</a></li>
                <li><a href="/man.html">men</a></li>
                <li><a href="/woman.html">women</a></li>
                <li><a href="/sale.html">Sale</a></li>
               <li><a href="docment.html">Best Perfume</a></li>
            </ul>
        </nav>
    </header>
    
    <!-- Contact Section -->
<section class="container mt-5">
<div class="row justify-content-center">

<div class="col-md-6">
<div class="card shadow p-4">

<h2 class="text-center mb-4">Contact Us ☎</h2>

<form>

<!-- Name -->
<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" placeholder="Enter your name">
</div>

<!-- Email -->
<div class="mb-3">
<label class="form-label">Email Address</label>
<input type="email" class="form-control" placeholder="Enter your email">
</div>

<!-- Message -->
<div class="mb-3">
<label class="form-label">Message</label>
<textarea class="form-control" rows="5" placeholder="Write your message"></textarea>
</div>

<!-- Button -->
<button type="submit" class="btn btn-primary w-100">
Send Message
</button>

</form>

</div>
</div>

</div>
</section>

<!-- Footer Start -->
<footer class="bg-dark text-white text-center py-3 mt-3">
<div class="container">
<p class="mb-1">© 2026 My Best Perfume</p>

<a href="#" class="text-white me-3">Home</a>
<a href="#" class="text-white me-3">About</a>
<a href="#" class="text-white">Contact</a>
</div>
 <p>made by sana@gmail.com</p>
</footer>
<!-- Footer End -->

</body>
</html>
